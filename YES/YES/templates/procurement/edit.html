{% extends "base.html" %}
{% block title %}Edit Procurement{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-pencil"></i> Edit Procurement</h2>
<div class="card shadow-sm">
    <div class="card-body p-4">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Title</label>
                <input type="text" name="title" class="form-control" value="{{ procurement.title }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Description</label>
                <textarea name="description" class="form-control" rows="3">{{ procurement.description or '' }}</textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Estimated Value (BWP)</label>
                    <input type="number" step="0.01" name="estimated_value" class="form-control" value="{{ procurement.estimated_value or '' }}">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Status</label>
                    <input type="text" class="form-control" value="{{ procurement.status.replace('_', ' ').title() }}" disabled>
                </div>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save Changes</button>
            <a href="{{ url_for('procurement.details', id=procurement.id) }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
