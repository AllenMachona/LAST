{% extends "base.html" %}
{% block title %}Assign Committee{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-people"></i> Assign Evaluation Committee</h2>
<div class="card shadow-sm">
    <div class="card-body p-4">
        <p class="text-muted">Procurement: {{ procurement.tender_number }} - {{ procurement.title }}</p>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Evaluation Type</label>
                <select name="evaluation_type" class="form-select" required>
                    <option value="technical">Technical Evaluation</option>
                    <option value="financial">Financial Evaluation</option>
                    <option value="combined">Combined</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Appointment Instrument Reference</label>
                <input type="text" name="instrument" class="form-control" placeholder="e.g., Memo Ref 123/2026" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Committee Members <span class="text-danger">*</span> (Min 3)</label>
                <div class="row">
                    {% for u in users %}
                    <div class="col-md-4 mb-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="member_ids" value="{{ u.id }}" id="user{{ u.id }}">
                            <label class="form-check-label" for="user{{ u.id }}">{{ u.get_full_name() }} <small class="text-muted">({{ u.role.name if u.role else 'No Role' }})</small></label>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Assign Committee</button>
            <a href="{{ url_for('committee.view', procurement_id=procurement.id) }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
