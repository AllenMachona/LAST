{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 text-danger">403</h1>
    <h2>Access Denied</h2>
    <p class="text-muted">You do not have permission to access this resource.</p>
    <p class="text-muted">Your role: <strong>{{ current_user.role.name if current_user.role else 'None' }}</strong></p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
